# Texto em Markdown exibido em /sobre
about: |
  ## Minha trajetória

  Entrei na **Franquias Odonto-Vida** em 2016 como auxiliar administrativo, cuidando
  de pesquisas, documentação e pequenos códigos em Delphi. Alguns anos depois passei a
  atuar como programador com uma missão clara: **migrar o sistema legado, um executável
  desktop, para a web com Java EE**.

  Concluída a migração, seguimos evoluindo a plataforma, hoje usada por **89 unidades
  e centenas de usuários ativos**, com novos módulos e integrações:

  - **Operação clínica:** agenda, tratamentos, contratos e auditoria.
  - **Pagamentos:** integrações com Vindi, Santander e Itaú.
  - **Fiscal:** emissão de notas fiscais integrada aos serviços do governo.
  - **Comunicação com pacientes:** envio de SMS e WhatsApp.

  ## Como trabalho

  Atuo no ciclo completo: entendo o problema com as áreas de negócio, modelo a solução,
  desenvolvo back-end e front-end, faço o deploy, configuro servidores e acompanho o
  sistema em produção. Nesse período o sistema ganhou **estabilidade, consultas mais
  rápidas e menor custo de infraestrutura**, mesmo crescendo continuamente.

  ## O que busco

  Oportunidades como **desenvolvedor fullstack ou back-end Java**, em modelo remoto,
  híbrido ou presencial (Rio de Janeiro). Inglês: nível básico.

  Neste blog escrevo sobre o que aprendo no dia a dia: sistemas legados, integrações e
  arquitetura com Java e Spring.

