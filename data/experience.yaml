# start/end no formato AAAA-MM (ou só AAAA) — deixe "end" vazio para o emprego atual
- company: Franquias Odonto-Vida
  role: Programador · Desenvolvedor Fullstack
  start: "2016"
  location: Rio de Janeiro · Presencial
  description: |
    Rede de franquias odontológicas com 89 clínicas. Faço parte da equipe que desenvolve e mantém o sistema de gestão que centenas de pessoas usam no dia a dia das unidades.
    • A equipe migrou o sistema legado, um executável desktop em Delphi, para uma aplicação web em Java EE e Spring rodando no WildFly.
    • Participo da criação dos módulos de agenda, tratamentos, contratos e auditoria em todas as etapas: levantamento de requisitos com as áreas de negócio, modelagem do banco, back-end, front-end e entrada em produção.
    • Trabalhei nas integrações com meios de pagamento (Vindi, Santander e Itaú), na emissão de nota fiscal eletrônica nos serviços do governo e no envio de SMS e WhatsApp para pacientes.
    • Também atuo na infraestrutura: deploy, configuração de servidores e sustentação em produção.
    • Com a nova plataforma, a equipe deixou o sistema mais estável, com consultas mais rápidas e menor custo de infraestrutura, mesmo com o uso crescendo sem parar.
    • Entrei em 2016 como auxiliar administrativo, fazendo pesquisas, documentação e pequenos códigos em Delphi, e depois passei para a área de desenvolvimento.
  stack: [Java, Java EE, Spring, WildFly, APIs REST, Integrações de pagamento, Delphi]
